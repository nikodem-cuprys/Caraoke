name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.11"

jobs:
  js:
    name: JS/TS (lint, typecheck, unit+integration tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build:shared

      - name: Set up API env
        working-directory: apps/api
        run: cp .env.example .env

      - name: Generate Prisma client
        working-directory: apps/api
        run: npx prisma generate

      - name: Typecheck API
        run: npm run --workspace @singlearn/api lint

      - name: Typecheck web
        run: npm run --workspace @singlearn/web lint

      - name: Unit + integration tests (shared + API)
        run: npm run test

      - name: Build API
        run: npm run --workspace @singlearn/api build

      - name: Build web
        run: npm run --workspace @singlearn/web build

  worker:
    name: Python worker (ruff, pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/worker/requirements.txt

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Cache ML model weights (faster-whisper / demucs)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/torch
          key: ml-models-${{ hashFiles('apps/worker/requirements.txt') }}

      - name: Install CPU-only torch, then the rest of requirements
        working-directory: apps/worker
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: ruff check
        working-directory: apps/worker
        run: ruff check .

      - name: ruff format --check
        working-directory: apps/worker
        run: ruff format --check .

      - name: pytest
        working-directory: apps/worker
        run: pytest -q

  bullmq-smoke-test:
    name: BullMqQueueProvider smoke test (real Redis)
    runs-on: ubuntu-latest
    needs: [js, worker]
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/worker/requirements.txt

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Cache ML model weights (faster-whisper / demucs)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/torch
          key: ml-models-${{ hashFiles('apps/worker/requirements.txt') }}

      - name: Install JS dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build:shared

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Set up virtual display + audio device
        run: |
          sudo apt-get install -y xvfb pulseaudio
          pulseaudio -D --exit-idle-time=-1 --disallow-exit
          sleep 1
          pactl load-module module-null-sink sink_name=DummyOutput
          pactl set-default-sink DummyOutput

      - name: Set up API against real Redis (queue only; storage/DB stay local/SQLite)
        working-directory: apps/api
        run: |
          cp .env.example .env
          sed -i 's/^QUEUE_PROVIDER=.*/QUEUE_PROVIDER=bullmq/' .env
          sed -i 's#^REDIS_URL=.*#REDIS_URL=redis://localhost:6379#' .env
          npx prisma generate
          npx prisma migrate deploy

      - name: Set up web env
        working-directory: apps/web
        run: cp .env.local.example .env.local

      - name: Set up worker venv
        working-directory: apps/worker
        run: |
          python -m venv .venv
          cp .env.example .env
          ./.venv/bin/pip install torch --index-url https://download.pytorch.org/whl/cpu
          ./.venv/bin/pip install -r requirements.txt

      - name: Run the real pipeline through BullMQ instead of the DB-backed queue
        # Headed (via xvfb), not headless: headless Chromium does not
        # reliably decode/advance <audio> playback in CI containers (a
        # known, long-standing Chromium limitation, not a Playwright
        # config issue) -- the real, full rendering+media pipeline only
        # runs the same as local dev when a real display is attached.
        run: xvfb-run --auto-servernum -- npm run test:e2e -- --headed

  s3-smoke-test:
    name: S3 storage smoke test (real MinIO)
    runs-on: ubuntu-latest
    needs: [js, worker]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/worker/requirements.txt

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Cache ML model weights (faster-whisper / demucs)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/torch
          key: ml-models-${{ hashFiles('apps/worker/requirements.txt') }}

      # MinIO can't run as a GitHub Actions `services:` container: that
      # mechanism has no way to override an image's ENTRYPOINT/CMD, and the
      # image's default CMD (bare `minio`) only prints its own CLI help and
      # exits rather than starting the server - it needs an explicit
      # `server /data` command. Starting it as a plain background container
      # instead gives full control over that command. Pulled from quay.io,
      # not Docker Hub's minio/minio - MinIO Inc. restricted anonymous
      # pulls of that repository (confirmed via `docker pull`: "pull access
      # denied ... repository does not exist"), quay.io/minio/minio is the
      # current public mirror.
      - name: Start MinIO
        run: |
          docker run -d --name minio \
            -p 9000:9000 -p 9001:9001 \
            -e MINIO_ROOT_USER=singlearn \
            -e MINIO_ROOT_PASSWORD=singlearn-secret \
            quay.io/minio/minio:latest server /data --console-address ":9001"

      - name: Wait for MinIO and create the bucket
        run: |
          curl -O https://dl.min.io/client/mc/release/linux-amd64/mc
          chmod +x mc
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:9000/minio/health/live >/dev/null; then break; fi
            sleep 1
          done
          ./mc alias set local http://localhost:9000 singlearn singlearn-secret
          ./mc mb -p local/singlearn

      - name: Install JS dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build:shared

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Set up virtual display + audio device
        run: |
          sudo apt-get install -y xvfb pulseaudio
          pulseaudio -D --exit-idle-time=-1 --disallow-exit
          sleep 1
          pactl load-module module-null-sink sink_name=DummyOutput
          pactl set-default-sink DummyOutput

      - name: Set up API against real MinIO (storage only; queue/DB stay local defaults)
        working-directory: apps/api
        run: |
          cp .env.example .env
          sed -i 's/^STORAGE_PROVIDER=.*/STORAGE_PROVIDER=s3/' .env
          cat >> .env <<'EOF'
          S3_BUCKET=singlearn
          S3_ENDPOINT=http://localhost:9000
          S3_REGION=us-east-1
          S3_FORCE_PATH_STYLE=true
          AWS_ACCESS_KEY_ID=singlearn
          AWS_SECRET_ACCESS_KEY=singlearn-secret
          EOF
          npx prisma generate
          npx prisma migrate deploy

      - name: Set up web env
        working-directory: apps/web
        run: cp .env.local.example .env.local

      - name: Set up worker venv
        working-directory: apps/worker
        run: |
          python -m venv .venv
          cp .env.example .env
          ./.venv/bin/pip install torch --index-url https://download.pytorch.org/whl/cpu
          ./.venv/bin/pip install -r requirements.txt

      - name: Run the real pipeline against real S3-compatible storage
        run: xvfb-run --auto-servernum -- npm run test:e2e -- --headed

      - name: Stop MinIO
        if: always()
        run: docker rm -f minio

  e2e:
    name: End-to-end (Playwright, real pipeline)
    runs-on: ubuntu-latest
    needs: [js, worker]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/worker/requirements.txt

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Cache ML model weights (faster-whisper / demucs)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/torch
          key: ml-models-${{ hashFiles('apps/worker/requirements.txt') }}

      - name: Install JS dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build:shared

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Set up virtual display + audio device
        run: |
          sudo apt-get install -y xvfb pulseaudio
          pulseaudio -D --exit-idle-time=-1 --disallow-exit
          sleep 1
          pactl load-module module-null-sink sink_name=DummyOutput
          pactl set-default-sink DummyOutput

      - name: Set up API (Prisma + SQLite)
        working-directory: apps/api
        run: |
          cp .env.example .env
          npx prisma generate
          npx prisma migrate deploy

      - name: Set up web env
        working-directory: apps/web
        run: cp .env.local.example .env.local

      - name: Set up worker venv (path matches tests/e2e/global-setup.ts)
        working-directory: apps/worker
        run: |
          python -m venv .venv
          cp .env.example .env
          ./.venv/bin/pip install torch --index-url https://download.pytorch.org/whl/cpu
          ./.venv/bin/pip install -r requirements.txt

      - name: Run Playwright e2e suite (starts api/web/worker itself)
        # Headed (via xvfb), not headless: headless Chromium does not
        # reliably decode/advance <audio> playback in CI containers (a
        # known, long-standing Chromium limitation, not a Playwright
        # config issue) -- the real, full rendering+media pipeline only
        # runs the same as local dev when a real display is attached.
        run: xvfb-run --auto-servernum -- npm run test:e2e -- --headed

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
