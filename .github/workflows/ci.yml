name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.11"

jobs:
  js:
    name: JS/TS (lint, typecheck, unit+integration tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build:shared

      - name: Set up API env
        working-directory: apps/api
        run: cp .env.example .env

      - name: Typecheck API
        run: npm run --workspace @singlearn/api lint

      - name: Typecheck web
        run: npm run --workspace @singlearn/web lint

      - name: Generate Prisma client
        working-directory: apps/api
        run: npx prisma generate

      - name: Unit + integration tests (shared + API)
        run: npm run test

      - name: Build API
        run: npm run --workspace @singlearn/api build

      - name: Build web
        run: npm run --workspace @singlearn/web build

  worker:
    name: Python worker (ruff, pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/worker/requirements.txt

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Cache ML model weights (faster-whisper / demucs)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/torch
          key: ml-models-${{ hashFiles('apps/worker/requirements.txt') }}

      - name: Install CPU-only torch, then the rest of requirements
        working-directory: apps/worker
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: ruff check
        working-directory: apps/worker
        run: ruff check .

      - name: ruff format --check
        working-directory: apps/worker
        run: ruff format --check .

      - name: pytest
        working-directory: apps/worker
        run: pytest -q

  e2e:
    name: End-to-end (Playwright, real pipeline)
    runs-on: ubuntu-latest
    needs: [js, worker]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/worker/requirements.txt

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Cache ML model weights (faster-whisper / demucs)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/torch
          key: ml-models-${{ hashFiles('apps/worker/requirements.txt') }}

      - name: Install JS dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build:shared

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Set up API (Prisma + SQLite)
        working-directory: apps/api
        run: |
          cp .env.example .env
          npx prisma generate
          npx prisma migrate deploy

      - name: Set up web env
        working-directory: apps/web
        run: cp .env.local.example .env.local

      - name: Set up worker venv (path matches tests/e2e/global-setup.ts)
        working-directory: apps/worker
        run: |
          python -m venv .venv
          cp .env.example .env
          ./.venv/bin/pip install torch --index-url https://download.pytorch.org/whl/cpu
          ./.venv/bin/pip install -r requirements.txt

      - name: Run Playwright e2e suite (starts api/web/worker itself)
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
